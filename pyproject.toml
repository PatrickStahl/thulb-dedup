[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmatcher"
version = "0.1.0"
description = "Abgleich einer lokalen Buchliste mit Bibliothekskatalogen"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "requests>=2.32,<3.0",
    "pytest>=8.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
bookmatcher = "bookmatcher.main:main"
bookmatcher-cleanup = "bookmatcher.cleanup:main"
bookmatcher-reconstruct = "bookmatcher.reconstruct:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
